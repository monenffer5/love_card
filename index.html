<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letter Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Конверт сверху -->
    <div class="card" id="envelopeWrapper">
        <div class="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-pocket"></div>
            <div class="heart-seal">❤️</div>
        </div>
        
        <div class="title-text">
            <h2>❤️ Happy past 1 Month ❤️</h2>
        </div>

        <!-- Красивый лук и стрела со скриншота (SVG) -->
        <div class="bow-container" id="bowContainer">
            <svg viewBox="0 0 200 100" width="140" height="70">
                <!-- Деревянная дуга лука -->
                <path d="M 20 10 Q 100 90 180 10" fill="none" stroke="#a0522d" stroke-width="8" stroke-linecap="round"/>
                <!-- Тетива -->
                <line x1="20" y1="10" x2="100" y2="50" stroke="#fff" stroke-width="2"/>
                <line x1="180" y1="10" x2="100" y2="50" stroke="#fff" stroke-width="2"/>
                <!-- Стрела -->
                <g>
                    <line x1="100" y1="85" x2="100" y2="20" stroke="#8b4513" stroke-width="4"/>
                    <!-- Красный наконечник -->
                    <polygon points="100,10 94,22 106,22" fill="#ff4d6d"/>
                    <!-- Розовое сердечко на хвосте стрелы -->
                    <circle cx="100" cy="85" r="7" fill="#ff758f"/>
                </g>
            </svg>
            <div class="hint-text">Aim & release to shoot Cupid's arrow</div>
        </div>
    </div>

    <!-- Всплывающее окно с котиком -->
    <div class="popup" id="popupWindow" style="display: none;">
        <div class="popup-header">
            <span>LOVE</span>
            <div class="popup-controls">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="popup-body">
            <h3 id="questionText">Happy past 1 month, my businka ❤️ Still love me?</h3>
            <img id="catImg" src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExeWpoYml2Yjh3YnB6dnJudjc4YWgwMmxiM21peHExbTV1dzMwMmxiayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/dRcMsUUrnR8He/giphy.gif" alt="Cat" class="cat-gif">
            <div class="btn-group">
                <button id="yesBtn">YES</button>
                <button id="noBtn">NO</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
